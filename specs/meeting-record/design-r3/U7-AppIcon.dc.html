<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>U7 app 圖示</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 760px; box-sizing: border-box; padding: 56px 64px; background: #0F1115; color: #ECEEF2; font-family: 'Noto Sans TC', sans-serif; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: baseline; gap: 20px">
<h1 style="margin: 0; font-size: 40px; font-weight: 700">U7 app 圖示</h1>
<span style="font-size: 16px; color: #9AA3B2">出現在隱私權清單、通知與 Finder；同時看 128／32／16 三種大小</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; flex-grow: 1">

<div style="display: flex; flex-direction: column; gap: 18px; padding: 28px; border-radius: 22px; background: #171A21; border: 1px solid #2A2F3A">
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">A ★ <span style="font-family: 'Noto Sans TC', sans-serif; font-size: 15px; font-weight: 500; color: #9AA3B2">錄製點＋聲波</span></div>
<div style="display: flex; align-items: flex-end; gap: 28px">
<svg width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="錄製點加聲波圖示"><rect x="8" y="8" width="144" height="144" rx="34" fill="#171A21" stroke="#2E333E" stroke-width="2"></rect><circle cx="62" cy="80" r="22" fill="{{signal}}"></circle><path d="M98 66 V94 M110 56 V104 M122 70 V90" stroke="#ECEEF2" stroke-width="7" stroke-linecap="round"></path></svg>
<svg width="40" height="40" viewBox="0 0 160 160" aria-hidden="true"><rect x="8" y="8" width="144" height="144" rx="34" fill="#171A21" stroke="#2E333E" stroke-width="4"></rect><circle cx="62" cy="80" r="22" fill="{{signal}}"></circle><path d="M98 66 V94 M110 56 V104 M122 70 V90" stroke="#ECEEF2" stroke-width="10" stroke-linecap="round"></path></svg>
<svg width="18" height="18" viewBox="0 0 160 160" aria-hidden="true"><rect x="8" y="8" width="144" height="144" rx="34" fill="#171A21"></rect><circle cx="62" cy="80" r="26" fill="{{signal}}"></circle><path d="M104 60 V100 M124 66 V94" stroke="#ECEEF2" stroke-width="16" stroke-linecap="round"></path></svg>
</div>
<div style="font-size: 14px; color: #C3C9D4; line-height: 1.7">和選單列的紅點同一套語言；16 px 時聲波減成兩條</div>
</div>

<div style="display: flex; flex-direction: column; gap: 18px; padding: 28px; border-radius: 22px; background: #171A21; border: 1px solid #2A2F3A">
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">B <span style="font-family: 'Noto Sans TC', sans-serif; font-size: 15px; font-weight: 500; color: #9AA3B2">對話泡泡＋錄製點</span></div>
<div style="display: flex; align-items: flex-end; gap: 28px">
<svg width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="對話泡泡加錄製點圖示"><rect x="8" y="8" width="144" height="144" rx="34" fill="#ECEEF2"></rect><path d="M40 52 H120 A10 10 0 0 1 130 62 V98 A10 10 0 0 1 120 108 H74 L56 124 V108 H40 A10 10 0 0 1 30 98 V62 A10 10 0 0 1 40 52 Z" fill="#171A21"></path><circle cx="80" cy="80" r="14" fill="{{signal}}"></circle></svg>
<svg width="40" height="40" viewBox="0 0 160 160" aria-hidden="true"><rect x="8" y="8" width="144" height="144" rx="34" fill="#ECEEF2"></rect><path d="M40 52 H120 A10 10 0 0 1 130 62 V98 A10 10 0 0 1 120 108 H74 L56 124 V108 H40 A10 10 0 0 1 30 98 V62 A10 10 0 0 1 40 52 Z" fill="#171A21"></path><circle cx="80" cy="80" r="16" fill="{{signal}}"></circle></svg>
<svg width="18" height="18" viewBox="0 0 160 160" aria-hidden="true"><rect x="8" y="8" width="144" height="144" rx="34" fill="#ECEEF2"></rect><path d="M36 48 H124 V108 H72 L52 128 V108 H36 Z" fill="#171A21"></path><circle cx="80" cy="78" r="20" fill="{{signal}}"></circle></svg>
</div>
<div style="font-size: 14px; color: #C3C9D4; line-height: 1.7">一看就知道跟「會議」有關；但泡泡圖示很多 app 在用</div>
</div>

<div style="display: flex; flex-direction: column; gap: 18px; padding: 28px; border-radius: 22px; background: #171A21; border: 1px solid #2A2F3A">
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">C <span style="font-family: 'Noto Sans TC', sans-serif; font-size: 15px; font-weight: 500; color: #9AA3B2">文件＋聲波</span></div>
<div style="display: flex; align-items: flex-end; gap: 28px">
<svg width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="文件加聲波圖示"><rect x="8" y="8" width="144" height="144" rx="34" fill="#1F232C" stroke="#2E333E" stroke-width="2"></rect><path d="M52 34 H96 L114 52 V126 H52 Z" fill="#ECEEF2"></path><path d="M64 70 H102 M64 84 H96" stroke="#9AA3B2" stroke-width="5" stroke-linecap="round"></path><path d="M66 106 V112 M76 98 V120 M86 102 V116 M96 106 V112" stroke="{{signal}}" stroke-width="5" stroke-linecap="round"></path></svg>
<svg width="40" height="40" viewBox="0 0 160 160" aria-hidden="true"><rect x="8" y="8" width="144" height="144" rx="34" fill="#1F232C"></rect><path d="M52 34 H96 L114 52 V126 H52 Z" fill="#ECEEF2"></path><path d="M68 98 V118 M84 92 V124 M100 100 V116" stroke="{{signal}}" stroke-width="8" stroke-linecap="round"></path></svg>
<svg width="18" height="18" viewBox="0 0 160 160" aria-hidden="true"><rect x="8" y="8" width="144" height="144" rx="34" fill="#1F232C"></rect><path d="M48 30 H112 V130 H48 Z" fill="#ECEEF2"></path><path d="M70 90 V120 M92 84 V124" stroke="{{signal}}" stroke-width="14" stroke-linecap="round"></path></svg>
</div>
<div style="font-size: 14px; color: #C3C9D4; line-height: 1.7">強調產出的是紀錄；16 px 時細節會糊</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"signal":{"editor":"color","default":"#FF4D4F","options":["#FF4D4F","#FF6A3D","#E5484D"]},"$preview":{"width":1440,"height":760}}'>
class Component extends DCLogic {
renderVals() {
return { signal: this.props.signal ?? '#FF4D4F' };
}
}
</script>
</body>
</html>
